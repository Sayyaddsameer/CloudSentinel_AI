version: 1
frontend:
  phases:
    preBuild:
      commands:
        - |
          echo "Generating env.js from Amplify environment variables..."
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          CFN_URL="https://cloudsentinel-artifacts-${ACCOUNT_ID}.s3.${ENV_REGION:-us-east-1}.amazonaws.com/templates/scanner-role.yaml"
          cat > modules/frontend/js/env.js << 'ENVEOF'
          /* Auto-generated by amplify.yml preBuild */
          ENVEOF
          echo "window.ENV_COGNITO_POOL_ID     = \"${ENV_COGNITO_POOL_ID}\";" >> modules/frontend/js/env.js
          echo "window.ENV_COGNITO_CLIENT_ID   = \"${ENV_COGNITO_CLIENT_ID}\";" >> modules/frontend/js/env.js
          echo "window.ENV_API_URL             = \"${ENV_API_URL}\";" >> modules/frontend/js/env.js
          echo "window.ENV_REGION              = \"${ENV_REGION:-us-east-1}\";" >> modules/frontend/js/env.js
          echo "window.ENV_CFN_TEMPLATE_URL    = \"https://cloudsentinel-artifacts-${ACCOUNT_ID}.s3.${ENV_REGION:-us-east-1}.amazonaws.com/templates/scanner-role.yaml\";" >> modules/frontend/js/env.js
          echo "window.ENV_PLATFORM_ACCOUNT_ID = \"${ACCOUNT_ID}\";" >> modules/frontend/js/env.js
          echo "window.ENV_LAMBDA_ROLE_NAME    = \"cloudsentinel-lambda-role\";" >> modules/frontend/js/env.js
          echo "env.js generated successfully"
    build:
      commands:
        - echo "Static site — no build step needed"
  artifacts:
    baseDirectory: modules/frontend
    files:
      - "**/*"
  cache:
    paths: []
