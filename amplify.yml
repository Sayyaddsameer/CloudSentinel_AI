version: 1
frontend:
  phases:
    preBuild:
      commands:
        - |
          echo "Generating env.js from Amplify environment variables..."
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          CFN_URL="https://cloudsentinel-artifacts-${ACCOUNT_ID}.s3.${ENV_REGION:-us-east-1}.amazonaws.com/templates/scanner-role.yaml"
          cat > modules/frontend/js/env.js << EOF
          /* Auto-generated by amplify.yml preBuild — do not commit */
          const ENV_COGNITO_POOL_ID   = "${ENV_COGNITO_POOL_ID}";
          const ENV_COGNITO_CLIENT_ID = "${ENV_COGNITO_CLIENT_ID}";
          const ENV_API_URL           = "${ENV_API_URL}";
          const ENV_REGION            = "${ENV_REGION:-us-east-1}";
          const ENV_CFN_TEMPLATE_URL  = "${CFN_URL}";
          const ENV_PLATFORM_ACCOUNT_ID = "${ACCOUNT_ID}";
          const ENV_LAMBDA_ROLE_NAME  = "cloudsentinel-lambda-role";
          EOF
          echo "env.js generated successfully"
    build:
      commands:
        - echo "Static site — no build step needed"
  artifacts:
    baseDirectory: modules/frontend
    files:
      - "**/*"
  cache:
    paths: []
